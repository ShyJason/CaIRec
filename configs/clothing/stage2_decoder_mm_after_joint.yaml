dataset: clothing
exp_mode: mm
train_stage: recommender
feature_bridge_mode: raw_decoder
gcn_frontend_mode: original_linear
selection_mode: val
recommendation_selection_metric: recall
recommendation_selection_topk: 20
evaluation_protocol: strict

device_id: 4
use_gpu: 1
seed: 2023

epoch: 200
eva_interval: 1
early_stop: 20
batch_size: 2048
lr: 0.01
lr_rec: 0.01
lr_imp: 0.0002
lr_decoder: 0.00005
freeze_imputer: 1
freeze_decoder: 1
recommender_allow_modal_grad: 0

reg_coeff: 0.01
penalty_coeff: 1.0
max_info_coeff: 0.01
min_info_coeff: 0.000001

contra_dim: 64
d_beta: 32
tau1: 0.1
tau2: 0.1
lambda_itm: 0.1
itm_temp: 0.07
itm_num_heads: 4
ema_eta: 0.01

modality_bpr_coeff: 0.2

missing_rate: 0.3
tensorboard: 1
hf_tensorboard_repo: ""
hf_token: ""
hf_commit_every: 5
save: 1
suffix: stage2_clothing_decoder_mm_after_joint

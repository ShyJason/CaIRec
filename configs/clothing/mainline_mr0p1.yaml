dataset: clothing
exp_mode: mm
train_stage: recommender
feature_bridge_mode: raw_decoder
gcn_frontend_mode: original_linear
selection_mode: val
recommendation_selection_metric: recall
recommendation_selection_topk: 20
evaluation_protocol: strict

device_id: 0
use_gpu: 1
seed: 2023
dataset_seed: 0
missing_mask_protocol: i3

epoch: 200
eva_interval: 1
early_stop: 20
batch_size: 2048
topk: [10, 20, 30, 40, 50]
lr: 0.01
lr_rec: 0.01
lr_imp: 0.0002
lr_decoder: 0.00005
freeze_imputer: 1
freeze_decoder: 1
recommender_allow_modal_grad: 0
disable_imputation: 0

# Historical missing-rate protocol: 10% missing during training, fixed 50%
# missing masks during validation/test.
missing_rate: 0.1
eval_missing_rate: 0.5

# Keep only the post-GCN true-missing InfoNCE objective.
rec_neighbor_cl_weight: 0.005
rec_neighbor_cl_temp: 0.2
rec_neighbor_cl_bank_size: 256

# Current Clothing 10% mainline from the completed topk10-local search.
item_graph_kind: fused_completed
item_graph_topk: 10
item_graph_norm: rw
item_graph_cf_weight: 0.2
item_graph_image_weight: 0.4
item_graph_text_weight: 0.4
item_graph_audio_weight: 0.0
item_graph_modal_alpha: 0.25
item_graph_modal_layers: 1
item_graph_modal_target: all

reg_coeff: 0.01
penalty_coeff: 1.0
max_info_coeff: 0.01
min_info_coeff: 0.000001
modality_bpr_coeff: 1.0

contra_dim: 64
d_beta: 32
tau1: 0.1
tau2: 0.1
lambda_itm: 0.1
itm_temp: 0.07
itm_num_heads: 4
ema_eta: 0.01

tensorboard: 0
hf_tensorboard_repo: ""
hf_token: ""
hf_commit_every: 5
save: 1
suffix: stage2_clothing_mr0p1_mainline

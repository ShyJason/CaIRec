dataset: baby
exp_mode: mm
train_stage: recommender
feature_bridge_mode: raw_decoder
gcn_frontend_mode: original_linear
completion_gate_mode: alignment
completion_gate_hidden_dim: 64
completion_gate_dropout: 0.1
completion_gate_init_logit: 3.0
completion_gate_detach_inputs: 1
completion_gate_floor: 0.9
completion_gate_target_mean: 0.95
completion_gate_reg_coeff: 0.0
completion_gate_alignment_center: 0.0
completion_gate_alignment_temp: 0.2
selection_mode: val
recommendation_selection_metric: recall
recommendation_selection_topk: 20

device_id: 4
use_gpu: 1
seed: 2023

epoch: 200
eva_interval: 1
early_stop: 20
batch_size: 256
lr: 0.001
lr_rec: 0.001
lr_imp: 0.0002
lr_decoder: 0.00005
freeze_imputer: 1
freeze_decoder: 1
recommender_allow_modal_grad: 0

reg_coeff: 0.0001
penalty_coeff: 50
max_info_coeff: 0.05
min_info_coeff: 0.05

contra_dim: 64
d_beta: 32
tau1: 0.1
tau2: 0.1
lambda_itm: 0.1
itm_temp: 0.07
itm_num_heads: 4
ema_eta: 0.01

missing_rate: 0.3
tensorboard: 1
hf_tensorboard_repo: Crispy30/i3-mrec-tensorboard
hf_token: ""
hf_commit_every: 5
save: 1
suffix: stage2_baby_recommender_decoder_gate_mm
